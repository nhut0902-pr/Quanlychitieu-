<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nhật Ký Chuyến Đi Offline</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&family=Dancing+Script:wght@700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#6366f1">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/000000/map-marker.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>
    <div id="app">
        <header>
            <h1>My Travel Journey</h1>
            <button id="theme-toggle" onclick="toggleDarkMode()" aria-label="Đổi chế độ sáng/tối">
                <svg id="theme-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <!-- Moon icon will be set by JS -->
                </svg>
            </button>
        </header>

        <main id="content">
            <!-- Content will be injected here -->
        </main>

        <nav class="bottom-nav">
            <button onclick="showSection('diary')" id="nav-diary">
                <svg viewBox="0 0 24 24" class="nav-icon"><path fill="currentColor" d="M21,4H3A2,2 0 0,0 1,6V19A2,2 0 0,0 3,21H21A2,2 0 0,0 23,19V6A2,2 0 0,0 21,4M21,19H3V6H21V19M19,9H5V7H19V9M19,13H5V11H19V13M19,17H5V15H19V17Z"/></svg>
                <span data-i18n="nav_diary">Nhật Ký</span>
            </button>
            <button onclick="showSection('itinerary')" id="nav-itinerary">
                <svg viewBox="0 0 24 24" class="nav-icon"><path fill="currentColor" d="M19,3H18V1H16V3H8V1H6V3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M19,19H5V9H19V19M19,7H5V5H19V7M7,11H12V13H7V11M7,15H17V17H7V15Z"/></svg>
                <span data-i18n="nav_itinerary">Lịch Trình</span>
            </button>
            <button onclick="showSection('weather')" id="nav-weather">
                <svg viewBox="0 0 24 24" class="nav-icon"><path fill="currentColor" d="M17.5,12A5.5,5.5 0 0,1 12,17.5A5.5,5.5 0 0,1 6.5,12A5.5,5.5 0 0,1 12,6.5A5.5,5.5 0 0,1 17.5,12M12,4V2M12,22V20M2,12H4M20,12H22M5.64,5.64L4.22,4.22M19.78,19.78L18.36,18.36M5.64,18.36L4.22,19.78M19.78,4.22L18.36,5.64Z"/></svg>
                <span data-i18n="nav_weather">Thời Tiết</span>
            </button>
            <button onclick="showSection('spending')" id="nav-spending">
                <svg viewBox="0 0 24 24" class="nav-icon"><path fill="currentColor" d="M21,18V19A2,2 0 0,1 19,21H5C3.89,21 3,20.1 3,19V5A2,2 0 0,1 5,3H19A2,2 0 0,1 21,5V6H12C10.89,6 10,6.9 10,8V16A2,2 0 0,0 12,18H21M12,16H22V8H12V16M16,13.5A1.5,1.5 0 0,1 14.5,12A1.5,1.5 0 0,1 16,10.5A1.5,1.5 0 0,1 17.5,12A1.5,1.5 0 0,1 16,13.5Z"/></svg>
                <span data-i18n="nav_spending">Chi Tiêu</span>
            </button>
            <button onclick="showSection('map')" id="nav-map">
                <svg viewBox="0 0 24 24" class="nav-icon"><path fill="currentColor" d="M12,2C8.13,2 5,5.13 5,9C5,14.25 12,22 12,22C12,22 19,14.25 19,9C19,5.13 15.87,2 12,2M12,11.5A2.5,2.5 0 0,1 9.5,9A2.5,2.5 0 0,1 12,6.5A2.5,2.5 0 0,1 14.5,9A2.5,2.5 0 0,1 12,11.5Z"/></svg>
                <span data-i18n="nav_map">Bản Đồ</span>
            </button>
            <button onclick="showSection('trips')" id="nav-trips">
                <svg viewBox="0 0 24 24" class="nav-icon"><path fill="currentColor" d="M18.92,6.01C18.72,5.42 18.16,5 17.5,5H6.5C5.84,5 5.28,5.42 5.08,6.01L3,12V20A1,1 0 0,0 4,21H5A1,1 0 0,0 6,20V19H18V20A1,1 0 0,0 19,21H20A1,1 0 0,0 21,20V12L18.92,6.01M6.5,16A1.5,1.5 0 1,1 8,14.5A1.5,1.5 0 0,1 6.5,16M17.5,16A1.5,1.5 0 1,1 19,14.5A1.5,1.5 0 0,1 17.5,16M5,11L6.5,6.5H17.5L19,11H5Z"/></svg>
                <span data-i18n="nav_trips">Chuyến Đi</span>
            </button>
            <button onclick="showSection('settings')" id="nav-settings">
                <svg viewBox="0 0 24 24" class="nav-icon"><path fill="currentColor" d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.35 19.43,11.03L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.97 19.05,5.05L16.56,6.05C16.04,5.66 15.47,5.34 14.86,5.1L14.48,2.45C14.43,2.21 14.22,2 14,2H10C9.78,2 9.57,2.21 9.52,2.45L9.14,5.1C8.53,5.34 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.97 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11.03C4.53,11.35 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.95C7.96,18.34 8.53,18.66 9.14,18.9L9.52,21.55C9.57,21.79 9.78,22 10,22H14C14.22,22 14.43,21.79 14.48,21.55L14.86,18.9C15.47,18.66 16.04,18.34 16.56,17.95L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z"/></svg>
                <span data-i18n="nav_settings">Cài Đặt</span>
            </button>
        </nav>
    </div>

    <!-- PDF Customization Modal -->
    <div id="pdf-modal" class="modal" style="display:none;">
        <div class="modal-content pdf-modal-wide">
            <h3 data-i18n="pdf_config_title">Tùy Chỉnh Báo Cáo PDF</h3>

            <div class="pdf-config-container">
                <div class="pdf-config-sidebar">
                    <div class="config-group">
                        <label data-i18n="pdf_template_label">Chọn mẫu thiết kế:</label>
                        <div class="template-grid" id="template-select">
                            <!-- Templates will be injected here -->
                        </div>
                    </div>

                    <div class="config-group">
                        <label data-i18n="pdf_font_label">Font chữ:</label>
                        <select id="pdf-font-select" onchange="updatePdfPreview()">
                            <option value="'Inter', sans-serif">Modern Sans (Inter)</option>
                            <option value="'Playfair Display', serif">Elegant Serif (Playfair)</option>
                            <option value="'JetBrains Mono', monospace">Technical Mono</option>
                            <option value="'Dancing Script', cursive">Handwritten</option>
                            <option value="'Montserrat', sans-serif">Geometric Sans</option>
                            <option value="'Roboto', sans-serif">Roboto</option>
                            <option value="'Lora', serif">Lora Serif</option>
                            <option value="'Pacifico', cursive">Pacifico Script</option>
                            <option value="'Oswald', sans-serif">Oswald Bold</option>
                            <option value="'Quicksand', sans-serif">Quicksand Soft</option>
                            <option value="'Caveat', cursive">Caveat Handwriting</option>
                            <option value="'Abril Fatface', serif">Abril Display</option>
                            <option value="'Raleway', sans-serif">Raleway Elegant</option>
                            <option value="'Comfortaa', cursive">Comfortaa Round</option>
                            <option value="'Cinzel', serif">Cinzel Decorative</option>
                            <option value="'Exo 2', sans-serif">Exo 2 Tech</option>
                        </select>
                    </div>

                    <div class="config-group">
                        <label data-i18n="pdf_color_label">Màu nhấn chủ đạo:</label>
                        <input type="color" id="pdf-accent-color" value="#6366f1" onchange="updatePdfPreview()" style="width:100%; height:40px; padding:0; background:none; border:1.5px solid var(--border); border-radius:8px; cursor:pointer;">
                    </div>
                </div>

                <div class="pdf-preview-main">
                    <label data-i18n="pdf_preview_label">Xem trước:</label>
                    <div id="pdf-preview-container">
                        <div id="pdf-preview-empty" class="preview-placeholder">
                            <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:0.3; margin-bottom:12px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                            <p style="font-size:13px; color:var(--text-muted);" data-i18n="pdf_preview_empty">Chọn mẫu để xem trước</p>
                        </div>
                        <iframe id="pdf-preview-iframe" title="PDF Preview"></iframe>
                    </div>
                </div>
            </div>

            <div class="modal-actions">
                <button onclick="closePdfModal()" style="background:var(--secondary);" data-i18n="cancel_btn">Hủy</button>
                <button id="download-pdf-btn" onclick="generateCustomPdf()" style="opacity:0.5; pointer-events:none;">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    <span data-i18n="export_btn">Tải xuống PDF</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Info Modal -->
    <div id="info-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3 id="info-modal-title">Info</h3>
            <div id="info-modal-body" style="font-size:14px; color:var(--text-main); margin:16px 0; line-height:1.6;"></div>
            <button onclick="closeInfoModal()" style="width:100%;">OK</button>
        </div>
    </div>

    <!-- Hidden elements for Picture-in-Picture -->
    <video id="pip-video" style="position:fixed; top:-1000px; left:-1000px; width:1px; height:1px; opacity:0; pointer-events:none;" autoplay muted playsinline></video>
    <canvas id="pip-canvas" width="300" height="300" style="display:none"></canvas>

    <!-- Templates -->
    <template id="weather-template">
        <section id="weather-section">
            <h2 data-i18n="weather_title">Dự Báo Thời Tiết</h2>
            <div class="weather-search-container">
                <form id="weather-form" style="margin-bottom:12px;">
                    <div style="display:flex; gap:8px;">
                        <input type="text" id="weather-search" placeholder="Nhập tên thành phố..." style="flex:1;">
                        <button type="submit" style="width:54px; height:48px; padding:0; background:var(--primary); color:white; flex-shrink:0;">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        </button>
                    </div>
                </form>
                <button onclick="getWeatherAtCurrentLocation()" style="background:var(--primary); font-size:14px; padding:12px; width:100%; margin-bottom:20px; box-shadow: var(--shadow); border: 2px solid rgba(255,255,255,0.2);">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    <strong data-i18n="weather_get_current">Cập nhật thời tiết bằng GPS</strong>
                </button>
            </div>

            <div id="weather-msg" style="text-align:center; color:var(--text-muted); padding:20px 0;"></div>
            <div id="weather-display" class="weather-display-card" style="display:none;">
                <!-- Weather info will be injected here -->
            </div>

            <div id="weather-forecast" class="weather-forecast-grid">
                <!-- Forecast will be injected here -->
            </div>

            <div class="extra-group" style="margin-top:24px; padding:16px; border: 1px dashed var(--border);">
                <h3 style="margin-top:0; font-size:14px;" data-i18n="weather_manual_update">Cập nhật thủ công (Offline)</h3>
                <form id="weather-manual-form">
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:8px;">
                        <input type="number" id="manual-temp" placeholder="25" required>
                        <input type="text" id="manual-desc" placeholder="Nắng đẹp" required>
                    </div>
                    <button type="submit" style="background:var(--secondary); font-size:12px; padding:8px;">
                        <span data-i18n="save_btn">Lưu</span>
                    </button>
                </form>
            </div>
        </section>
    </template>

    <template id="itinerary-template">
        <section id="itinerary-section">
            <h2 id="current-trip-title-itinerary" data-i18n="itinerary_title">Lịch Trình Chuyến Đi</h2>
            <form id="itinerary-form">
                <input type="text" id="itinerary-activity" placeholder="Hoạt động" required>
                <div style="display:flex; gap:12px; width: 100%;">
                    <input type="text" id="itinerary-location" placeholder="Địa điểm" style="flex:1;">
                    <input type="time" id="itinerary-time" style="width: 120px; flex-shrink: 0;">
                </div>
                <button type="submit">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
                    <span data-i18n="add_itinerary">Thêm Lịch Trình</span>
                </button>
            </form>
            <div id="itinerary-list"></div>
        </section>
    </template>

    <template id="trips-template">
        <section id="trips-section">
            <h2 data-i18n="nav_trips">Quản Lý Chuyến Đi</h2>
            <form id="trip-form">
                <input type="text" id="trip-name" placeholder="Tên chuyến đi mới (vd: Đà Lạt 2024)" required>
                <div style="display:flex; gap:12px; align-items:center;">
                    <label style="font-size:14px; font-weight:600; color:var(--text-muted); white-space:nowrap;" data-i18n="start_date_label">Ngày bắt đầu:</label>
                    <input type="date" id="trip-start-date" required style="flex:1;">
                </div>
                <button type="submit">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    <span data-i18n="add_trip">Tạo Chuyến Đi Mới</span>
                </button>
            </form>
            <div id="trip-list" style="margin-top: 24px;">
                <!-- Trips will be listed here -->
            </div>
        </section>
    </template>

    <template id="diary-template">
        <section id="diary-section">
            <h2 id="current-trip-title-diary" data-i18n="nav_diary">Nhật Ký Chuyến Đi</h2>
            <form id="diary-form">
                <input type="text" id="start-point" placeholder="Điểm xuất phát" required>
                <input type="text" id="end-point" placeholder="Điểm đến" required>
                <div style="display:flex; gap:8px; width: 100%;">
                    <input type="datetime-local" id="departure-time" required style="flex:1;">
                    <button type="button" onclick="getDiaryLocation()" style="width:48px; flex-shrink: 0; padding: 0;" title="Lưu vị trí GPS">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    </button>
                </div>
                <input type="hidden" id="diary-coords">
                <div style="display:flex; gap:8px; margin-bottom: 4px;">
                    <label style="flex:1; background:var(--bg-body); color:var(--primary); font-weight:600; padding:12px; border:1.5px dashed var(--primary); border-radius:10px; text-align:center; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                        <span data-i18n="add_photo">Thêm Ảnh</span>
                        <input type="file" id="diary-photos" accept="image/*" multiple style="display:none;" onchange="handlePhotoSelect(event)">
                    </label>
                </div>
                <div id="photo-preview" style="display:flex; gap:8px; margin-bottom:8px; overflow-x:auto; padding-bottom:4px;"></div>
                <textarea id="food-place" placeholder="Ăn gì ở đâu?" rows="3"></textarea>
                <div style="display:flex; gap:12px; align-items:center; width: 100%;">
                    <input type="number" id="trip-cost" placeholder="Giá cả (ước tính)" style="flex:1;">
                    <select id="diary-rating" style="width:130px; flex-shrink: 0;">
                        <option value="5">5 Stars</option>
                        <option value="4">4 Stars</option>
                        <option value="3">3 Stars</option>
                        <option value="2">2 Stars</option>
                        <option value="1">1 Star</option>
                    </select>
                </div>
                <button type="submit">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
                    <span data-i18n="add_diary">Thêm Nhật Ký</span>
                </button>
            </form>
            <div class="search-box">
                <input type="text" id="diary-search" placeholder="Tìm kiếm nhật ký..." oninput="renderDiaries()">
            </div>
            <div id="diary-list"></div>
        </section>
    </template>

    <template id="spending-template">
        <section id="spending-section">
            <h2 id="current-trip-title-spending">Quản Lý Chi Tiêu</h2>
            <div id="spending-analytics" style="margin-bottom: 24px; background: var(--bg-body); padding: 20px; border-radius: var(--radius); border: 1px solid var(--border);">
                <h3 style="margin-top:0; font-size: 16px; margin-bottom:16px;" data-i18n="spending_analytics">Phân Tích Chi Tiêu</h3>
                <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
                    <canvas id="spending-chart" width="200" height="200" style="max-width: 100%; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));"></canvas>
                    <div id="chart-legend" style="width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px;"></div>
                </div>
            </div>
            <div class="budget-container">
                <label style="font-size: 14px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; display: block;" data-i18n="budget_label">Ngân sách dự kiến:</label>
                <input type="number" id="budget-limit" placeholder="Đặt ngân sách" value="1000000">
                <div class="progress-bar">
                    <div id="budget-progress" class="progress-fill"></div>
                </div>
                <p id="budget-info">0 / 1,000,000</p>
            </div>
            <form id="spending-form">
                <input type="text" id="spend-item" placeholder="Tên món ăn/đồ dùng" required>
                <div style="display:flex; gap:12px; width: 100%;">
                    <input type="number" id="spend-amount" placeholder="Giá tiền" required style="flex:1;">
                    <select id="spend-category" style="width: 150px; flex-shrink: 0;">
                    </select>
                </div>
                <button type="submit">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
                    <span data-i18n="add_spending">Ghi Chi Tiêu</span>
                </button>
            </form>
            <ul id="spending-list"></ul>
        </section>
    </template>

    <template id="settings-template">
        <section id="settings-section">
            <h2 id="current-trip-title-settings" data-i18n="settings_title">Cài Đặt</h2>

            <div class="extra-group">
                <h3 data-i18n="appearance_lang">Giao diện & Ngôn ngữ</h3>
                <div style="display:flex; flex-direction:column; gap:16px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:500;" data-i18n="select_language">Ngôn ngữ:</span>
                        <select id="lang-select" onchange="changeLanguage(this.value)" style="width:140px;">
                            <option value="vi">Tiếng Việt</option>
                            <option value="en">English</option>
                        </select>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:500;" data-i18n="theme_color">Màu chủ đạo:</span>
                        <input type="color" id="theme-color-picker" onchange="changeThemeColor(this.value)" style="width:48px; height:32px; padding:0; border:1px solid var(--border); border-radius:4px; cursor:pointer; background:none;">
                    </div>
                    <div style="display:flex; flex-direction:column; gap:8px;">
                        <span style="font-weight:500; font-size:14px;" data-i18n="weather_api_key_label">Mã WeatherAPI.com (Key):</span>
                        <input type="text" id="weather-api-key-input" onchange="updateWeatherKey(this.value)" style="font-size:13px;">
                    </div>
                </div>
            </div>

            <hr style="border:none; border-top:1px solid var(--border); margin:24px 0;">

            <div class="extra-group" style="padding: 16px; background: rgba(99, 102, 241, 0.05); border-radius: 12px; border: 1px solid var(--primary);">
                <h3 style="margin-top:0" data-i18n="notifications_title">Thông Báo & Chạy Ngầm</h3>
                <div style="display:flex; flex-direction:column; gap:16px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:14px;" data-i18n="notify_motion">Thông báo di chuyển (>10km/h)</span>
                        <label class="switch">
                            <input type="checkbox" id="notify-motion-toggle" onchange="toggleMotionNotify(this.checked)">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:14px; color:#ef4444; font-weight:600;" data-i18n="keep_alive">Chạy ngầm (Âm thanh im lặng)</span>
                        <label class="switch">
                            <input type="checkbox" id="keep-alive-toggle" onchange="toggleKeepAlive(this.checked)">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:14px;" data-i18n="wake_lock">Luôn sáng màn hình</span>
                        <label class="switch">
                            <input type="checkbox" id="wake-lock-toggle" onchange="toggleWakeLock(this.checked)">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div style="background: rgba(239, 68, 68, 0.1); padding: 10px; border-radius: 8px; display: flex; gap: 8px;">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#ef4444" stroke-width="2" style="flex-shrink:0; margin-top:2px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                        <small style="color:#ef4444; font-weight:500; font-size:11px; line-height:1.4;" data-i18n="keep_alive_note">* Bật cả 2 để GPS cập nhật chính xác nhất khi thu nhỏ app.</small>
                    </div>
                </div>
            </div>

            <hr style="border:none; border-top:1px solid var(--border); margin:24px 0;">

            <div class="extra-group">
                <h3 data-i18n="checklist_title">Danh Sách Chuẩn Bị</h3>
                <form id="checklist-form" style="display:flex; gap:8px; margin-bottom:12px;">
                    <input type="text" id="checklist-item" placeholder="Thêm đồ dùng..." required style="flex:1;">
                    <button type="submit" style="width:auto; padding:0 16px;">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                </form>
                <ul id="checklist-list"></ul>
            </div>

            <hr style="border:none; border-top:1px solid var(--border); margin:24px 0;">

            <div class="extra-group">
                <h3 data-i18n="emergency_title">Thông Tin Khẩn Cấp</h3>
                <textarea id="emergency-info" placeholder="Liên hệ người thân, nhóm máu, dị ứng..." style="height:100px; margin-bottom:12px;"></textarea>
                <button onclick="saveEmergencyInfo()" style="background:var(--secondary);">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    <span data-i18n="save_btn">Lưu Thông Tin</span>
                </button>
            </div>

            <hr style="border:none; border-top:1px solid var(--border); margin:24px 0;">

            <div class="extra-group">
                <h3 data-i18n="data_report">Dữ Liệu & Báo Cáo</h3>
                <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:16px;">
                    <button onclick="showManual()" style="background:var(--secondary); font-size:13px; padding:8px;">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                        <span data-i18n="help_btn">Hướng Dẫn</span>
                    </button>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                        <button onclick="showTerms()" style="background:var(--bg-body); color:var(--text-muted); border:1px solid var(--border); font-size:12px; padding:8px;">
                            <span data-i18n="terms_btn">Điều Khoản</span>
                        </button>
                        <button onclick="showUpdates()" style="background:var(--bg-body); color:var(--text-muted); border:1px solid var(--border); font-size:12px; padding:8px;">
                            <span data-i18n="updates_btn">Bản Cập Nhật</span>
                        </button>
                    </div>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                    <button onclick="generateTripReport()" style="grid-column: span 2;">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        <span data-i18n="export_report">Xuất Báo Cáo PDF</span>
                    </button>
                    <button onclick="exportData()" style="background: #3b82f6;">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        <span data-i18n="export_json">Xuất JSON</span>
                    </button>
                    <button onclick="document.getElementById('import-file').click()" style="background: #f59e0b;">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        <span data-i18n="import_json">Nhập Dữ Liệu</span>
                    </button>
                </div>
                <input type="file" id="import-file" style="display:none" onchange="importData(event)">
                <button onclick="clearAllData()" style="background:#ef4444; margin-top:16px; width:100%;">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                    <span data-i18n="clear_all">Xóa Tất Cả</span>
                </button>
            </div>

            <div style="margin-top: 48px; text-align: center; font-size: 13px; color: var(--text-muted);">
                <p>Powered By <strong>Nhutcoder</strong></p>
            </div>
        </section>
    </template>

    <template id="map-template">
        <section id="map-section">
            <h2 id="current-trip-title-map" data-i18n="map_title">Bản Đồ Hành Trình</h2>
            <div id="speedometer-container">
                <div style="text-align: center;">
                    <div class="speed-unit" data-i18n="current_speed">Speed</div>
                    <div class="speed-value"><span id="speed-value">0</span> <small style="font-size: 14px; font-weight: 500;">km/h</small></div>
                </div>
                <div style="width: 1px; height: 50px; background: rgba(255,255,255,0.1);"></div>
                <div style="text-align: center;">
                    <div class="speed-unit" data-i18n="total_distance">Distance</div>
                    <div class="speed-value"><span id="total-distance-value">0.00</span> <small style="font-size: 14px; font-weight: 500;">km</small></div>
                </div>
            </div>
            <div id="map"></div>
            <div id="milestone-history" style="margin-top: 20px; background: var(--bg-body); padding: 16px; border-radius: var(--radius); border: 1px solid var(--border);">
                <h3 style="margin-top: 0; font-size: 15px; margin-bottom:12px; display: flex; align-items: center; justify-content: space-between;" data-i18n="milestone_history">Lịch sử mốc quãng đường</h3>
                <ul id="milestone-list" style="list-style: none; padding: 0; max-height: 150px; overflow-y: auto;">
                </ul>
            </div>
            <div class="map-controls">
                <button id="pip-btn" onclick="togglePiP()" style="background:var(--primary); width:100%; margin-bottom:12px;">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><rect x="13" y="10" width="7" height="5" rx="1"></rect></svg>
                    <span data-i18n="pip_btn">Hiện Cửa Sổ Nổi (PiP)</span>
                </button>
                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px; width:100%;">
                    <button onclick="markCurrentLocation('start')" style="background:#10b981; padding: 10px 5px; font-size:13px;" data-i18n="mark_start">Điểm Đi</button>
                    <button onclick="markCurrentLocation('dest')" style="background:#3b82f6; padding: 10px 5px; font-size:13px;" data-i18n="mark_dest">Điểm Đến</button>
                    <button onclick="markCurrentLocation('return')" style="background:#ef4444; padding: 10px 5px; font-size:13px;" data-i18n="mark_return">Điểm Về</button>
                </div>
                <button onclick="recenterMap()" style="background:var(--secondary); width:100%; margin-top:8px;">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line></svg>
                    <span data-i18n="recenter_btn">Tâm Vị Trí</span>
                </button>
            </div>
        </section>
    </template>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log("SW error", err));
            });
        }
    </script>
</body>
</html>
