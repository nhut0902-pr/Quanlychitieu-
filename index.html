<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhật Ký Chuyến Đi Offline</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/000000/map-marker.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>
    <div id="app">
        <header>
            <h1>Chuyến Đi Của Tôi</h1>
            <button id="theme-toggle" onclick="toggleDarkMode()" aria-label="Đổi chế độ sáng/tối">🌙</button>
        </header>

        <main id="content">
            <!-- Content will be injected here -->
        </main>

        <nav class="bottom-nav">
            <button onclick="showSection('diary')" id="nav-diary">Nhật Ký</button>
            <button onclick="showSection('spending')" id="nav-spending">Chi Tiêu</button>
            <button onclick="showSection('map')" id="nav-map">Bản Đồ</button>
            <button onclick="showSection('checklist')" id="nav-checklist">Danh Sách</button>
            <button onclick="showSection('extra')" id="nav-extra">Tiện Ích</button>
        </nav>
    </div>

    <!-- Templates -->
    <template id="diary-template">
        <section id="diary-section">
            <h2>Nhật Ký Chuyến Đi</h2>
            <form id="diary-form">
                <input type="text" id="start-point" placeholder="Điểm xuất phát" required>
                <input type="text" id="end-point" placeholder="Điểm đến" required>
                <div style="display:flex; gap:5px;">
                    <input type="datetime-local" id="departure-time" required style="flex:1;">
                    <button type="button" onclick="getDiaryLocation()" style="width:50px;" title="Lưu vị trí GPS">📍</button>
                </div>
                <input type="hidden" id="diary-coords">
                <textarea id="food-place" placeholder="Ăn gì ở đâu?"></textarea>
                <div style="display:flex; gap:10px; align-items:center;">
                    <input type="number" id="trip-cost" placeholder="Giá cả (ước tính)" style="flex:1;">
                    <select id="diary-rating" style="width:80px;">
                        <option value="5">⭐⭐⭐⭐⭐</option>
                        <option value="4">⭐⭐⭐⭐</option>
                        <option value="3">⭐⭐⭐</option>
                        <option value="2">⭐⭐</option>
                        <option value="1">⭐</option>
                    </select>
                </div>
                <button type="submit">Thêm Nhật Ký</button>
            </form>
            <div class="search-box">
                <input type="text" id="diary-search" placeholder="Tìm kiếm nhật ký..." oninput="renderDiaries()">
            </div>
            <div id="diary-list"></div>
        </section>
    </template>

    <template id="spending-template">
        <section id="spending-section">
            <h2>Quản Lý Chi Tiêu</h2>
            <div class="budget-container">
                <label for="budget-limit">Ngân sách:</label>
                <input type="number" id="budget-limit" placeholder="Đặt ngân sách" value="1000000">
                <div class="progress-bar">
                    <div id="budget-progress" class="progress-fill"></div>
                </div>
                <p id="budget-info">0 / 1,000,000</p>
            </div>
            <form id="spending-form">
                <input type="text" id="spend-item" placeholder="Tên món ăn/đồ dùng" required>
                <div style="display:flex; gap:5px;">
                    <input type="number" id="spend-amount" placeholder="Giá tiền" required style="flex:1;">
                    <select id="spend-category">
                        <option value="Ăn uống">🍴 Ăn uống</option>
                        <option value="Di chuyển">🚗 Di chuyển</option>
                        <option value="Lưu trú">🏨 Lưu trú</option>
                        <option value="Khác">🏷️ Khác</option>
                    </select>
                </div>
                <button type="submit">Ghi Chi Tiêu</button>
            </form>
            <ul id="spending-list"></ul>
        </section>
    </template>

    <template id="checklist-template">
        <section id="checklist-section">
            <h2>Danh Sách Chuẩn Bị</h2>
            <form id="checklist-form" style="flex-direction:row;">
                <input type="text" id="checklist-item" placeholder="Thêm đồ dùng..." required style="flex:1;">
                <button type="submit">Thêm</button>
            </form>
            <ul id="checklist-list"></ul>
        </section>
    </template>

    <template id="extra-template">
        <section id="extra-section">
            <h2>Tiện Ích & Cài Đặt</h2>

            <div class="extra-group">
                <h3>Thống Kê Chi Tiêu</h3>
                <div id="stats-content"></div>
            </div>

            <hr>

            <div class="extra-group">
                <h3>Thông Tin Khẩn Cấp</h3>
                <textarea id="emergency-info" placeholder="Liên hệ người thân, nhóm máu, dị ứng..." style="height:100px;"></textarea>
                <button onclick="saveEmergencyInfo()">Lưu Thông Tin</button>
            </div>

            <hr>

            <div class="extra-group">
                <h3>Dữ Liệu</h3>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <button onclick="exportData()" style="background:#2196F3;">Xuất Dữ Liệu (JSON)</button>
                    <button onclick="document.getElementById('import-file').click()" style="background:#ff9800;">Nhập Dữ Liệu</button>
                </div>
                <input type="file" id="import-file" style="display:none" onchange="importData(event)">
                <button onclick="clearAllData()" style="background:#f44336; margin-top:10px;">Xóa Tất Cả Dữ Liệu</button>
            </div>
        </section>
    </template>

    <template id="map-template">
        <section id="map-section">
            <h2>Bản Đồ Hành Trình</h2>
            <div id="map"></div>
            <div class="map-controls">
                <button onclick="markCurrentLocation('start')">Đánh dấu Điểm Đi</button>
                <button onclick="markCurrentLocation('dest')">Đánh dấu Điểm Đến</button>
                <button onclick="markCurrentLocation('return')">Đánh dấu Điểm Về</button>
            </div>
        </section>
    </template>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
