<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhật Ký Chuyến Đi Offline</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3f51b5">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/000000/map-marker.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>
    <div id="app">
        <header>
            <h1>Chuyến Đi Của Tôi</h1>
            <button id="theme-toggle" onclick="toggleDarkMode()" aria-label="Đổi chế độ sáng/tối">🌙</button>
        </header>

        <main id="content">
            <!-- Content will be injected here -->
        </main>

        <nav class="bottom-nav">
            <button onclick="showSection('diary')" id="nav-diary">Nhật Ký</button>
            <button onclick="showSection('spending')" id="nav-spending">Chi Tiêu</button>
            <button onclick="showSection('map')" id="nav-map">Bản Đồ</button>
            <button onclick="showSection('trips')" id="nav-trips">Chuyến Đi</button>
            <button onclick="showSection('extra')" id="nav-extra">Tiện Ích</button>
        </nav>
    </div>

    <!-- Templates -->
    <template id="trips-template">
        <section id="trips-section">
            <h2>Quản Lý Chuyến Đi</h2>
            <form id="trip-form">
                <input type="text" id="trip-name" placeholder="Tên chuyến đi mới (vd: Đà Lạt 2024)" required>
                <button type="submit">Tạo Chuyến Đi Mới</button>
            </form>
            <div id="trip-list" style="margin-top: 20px;">
                <!-- Trips will be listed here -->
            </div>
        </section>
    </template>

    <template id="diary-template">
        <section id="diary-section">
            <h2 id="current-trip-title-diary">Nhật Ký Chuyến Đi</h2>
            <form id="diary-form">
                <input type="text" id="start-point" placeholder="Điểm xuất phát" required>
                <input type="text" id="end-point" placeholder="Điểm đến" required>
                <div style="display:flex; gap:5px;">
                    <input type="datetime-local" id="departure-time" required style="flex:1;">
                    <button type="button" onclick="getDiaryLocation()" style="width:50px;" title="Lưu vị trí GPS">📍</button>
                </div>
                <input type="hidden" id="diary-coords">
                <div style="display:flex; gap:5px; margin-bottom: 10px;">
                    <label style="flex:1; background:#eee; padding:10px; border-radius:8px; text-align:center; cursor:pointer;">
                        📷 Thêm Ảnh
                        <input type="file" id="diary-photos" accept="image/*" multiple style="display:none;" onchange="handlePhotoSelect(event)">
                    </label>
                </div>
                <div id="photo-preview" style="display:flex; gap:5px; margin-bottom:10px; overflow-x:auto;"></div>
                <textarea id="food-place" placeholder="Ăn gì ở đâu?"></textarea>
                <div style="display:flex; gap:10px; align-items:center;">
                    <input type="number" id="trip-cost" placeholder="Giá cả (ước tính)" style="flex:1;">
                    <select id="diary-rating" style="width:80px;">
                        <option value="5">⭐⭐⭐⭐⭐</option>
                        <option value="4">⭐⭐⭐⭐</option>
                        <option value="3">⭐⭐⭐</option>
                        <option value="2">⭐⭐</option>
                        <option value="1">⭐</option>
                    </select>
                </div>
                <button type="submit">Thêm Nhật Ký</button>
            </form>
            <div class="search-box">
                <input type="text" id="diary-search" placeholder="Tìm kiếm nhật ký..." oninput="renderDiaries()">
            </div>
            <div id="diary-list"></div>
        </section>
    </template>

    <template id="spending-template">
        <section id="spending-section">
            <h2 id="current-trip-title-spending">Quản Lý Chi Tiêu</h2>
            <div id="spending-analytics" class="extra-group" style="margin-bottom: 20px; background: rgba(0,0,0,0.03); padding: 15px; border-radius: 8px;">
                <h3 style="margin-top:0">Phân Tích Chi Tiêu</h3>
                <div style="display: flex; flex-direction: column; align-items: center;">
                    <canvas id="spending-chart" width="200" height="200" style="max-width: 100%;"></canvas>
                    <div id="chart-legend" style="margin-top: 10px; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 12px;"></div>
                </div>
            </div>
            <div class="budget-container">
                <label for="budget-limit">Ngân sách:</label>
                <input type="number" id="budget-limit" placeholder="Đặt ngân sách" value="1000000">
                <div class="progress-bar">
                    <div id="budget-progress" class="progress-fill"></div>
                </div>
                <p id="budget-info">0 / 1,000,000</p>
            </div>
            <form id="spending-form">
                <input type="text" id="spend-item" placeholder="Tên món ăn/đồ dùng" required>
                <div style="display:flex; gap:5px;">
                    <input type="number" id="spend-amount" placeholder="Giá tiền" required style="flex:1;">
                    <select id="spend-category">
                        <option value="Ăn uống">🍴 Ăn uống</option>
                        <option value="Di chuyển">🚗 Di chuyển</option>
                        <option value="Lưu trú">🏨 Lưu trú</option>
                        <option value="Khác">🏷️ Khác</option>
                    </select>
                </div>
                <button type="submit">Ghi Chi Tiêu</button>
            </form>
            <ul id="spending-list"></ul>
        </section>
    </template>

    <template id="extra-template">
        <section id="extra-section">
            <h2 id="current-trip-title-extra">Tiện Ích</h2>

            <div class="extra-group">
                <h3>Danh Sách Chuẩn Bị</h3>
                <form id="checklist-form" style="display:flex; gap:5px; margin-bottom:10px;">
                    <input type="text" id="checklist-item" placeholder="Thêm đồ dùng..." required style="flex:1;">
                    <button type="submit" style="width:auto; padding:0 15px;">Thêm</button>
                </form>
                <ul id="checklist-list"></ul>
            </div>

            <hr>

            <div class="extra-group">
                <h3>Thông Tin Khẩn Cấp</h3>
                <textarea id="emergency-info" placeholder="Liên hệ người thân, nhóm máu, dị ứng..." style="height:100px;"></textarea>
                <button onclick="saveEmergencyInfo()">Lưu Thông Tin</button>
            </div>

            <hr>

            <div class="extra-group">
                <h3>Dữ Liệu & Báo Cáo</h3>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <button onclick="generateTripReport()" style="background:#3f51b5; grid-column: span 2;">Xuất Báo Cáo Tổng Kết (PDF)</button>
                    <button onclick="exportData()" style="background:#2196F3;">Xuất Dữ Liệu (JSON)</button>
                    <button onclick="document.getElementById('import-file').click()" style="background:#ff9800;">Nhập Dữ Liệu</button>
                </div>
                <input type="file" id="import-file" style="display:none" onchange="importData(event)">
                <button onclick="clearAllData()" style="background:#f44336; margin-top:10px;">Xóa Tất Cả Dữ Liệu</button>
            </div>
        </section>
    </template>

    <template id="map-template">
        <section id="map-section">
            <h2 id="current-trip-title-map">Bản Đồ Hành Trình</h2>
            <div id="map"></div>
            <div class="map-controls">
                <button onclick="markCurrentLocation('start')" style="background:#28a745;">Điểm Đi</button>
                <button onclick="markCurrentLocation('dest')" style="background:#007bff;">Điểm Đến</button>
                <button onclick="markCurrentLocation('return')" style="background:#dc3545;">Điểm Về</button>
                <button onclick="recenterMap()" style="background:#6c757d; width:100%;">Tâm Vị Trí Hiện Tại</button>
            </div>
        </section>
    </template>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
